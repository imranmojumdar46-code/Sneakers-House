[build]
  publish = "frontend"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["database/**", "frontend/**"]

# All /api calls go to the Express app running as a Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/product/*"
  to = "/product_detail.html"
  status = 200
