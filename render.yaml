services:
  - type: web
    name: sneakers-house
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: BKASH_NUMBER
        value: "01611755093"
      - key: GOOGLE_CLIENT_ID
        sync: false
