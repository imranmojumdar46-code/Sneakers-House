<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sneakers House</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">Sneakers<span>House</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/products.html">Shop</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="header-actions" id="headerActions"></div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container" style="max-width:420px">
      <h1 class="section-title" style="text-align:center">Welcome Back</h1>
      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username">Username or Email *</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="demo">
        </div>
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Login</button>
      </form>
      <div id="googleBox" style="margin-top:1.25rem;text-align:center">
        <p style="color:var(--text-muted);margin-bottom:.75rem">— or —</p>
        <div class="g-slot" style="display:flex;justify-content:center"></div>
      </div>
      <p style="text-align:center;margin-top:1.5rem;color:var(--text-muted)">
        Don't have an account? <a href="/register.html" style="color:var(--text);font-weight:600">Sign Up</a>
      </p>
      <p style="text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--text-muted)">
        Demo: <strong>demo</strong> / <strong>demo1234</strong>
      </p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container"><div class="footer-bottom"><p>&copy; 2026 Sneakers House.</p></div></div>
</footer>
<script src="/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => initGoogleButton('googleBox'));
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  [username, password].forEach(clearFieldError);
  let valid = true;
  if (!username.value.trim()) { setFieldError(username, 'Username is required'); valid = false; }
  if (password.value.length < 6) { setFieldError(password, 'Password must be at least 6 characters'); valid = false; }
  if (!valid) return;

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ username: username.value.trim(), password: password.value })
  });
  const data = await res.json();
  if (data.success) {
    showAlert(data.message, 'success');
    setTimeout(() => { window.location.href = '/'; }, 800);
  } else {
    showAlert(data.message, 'error');
  }
});
</script>
</body>
</html>
