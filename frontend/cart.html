<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Sneakers House</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">Sneakers<span>House</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/products.html">Shop</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="header-actions" id="headerActions"></div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <h1 class="section-title">Your Cart</h1>
      <div id="cartContent"><p>Loading cart...</p></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container"><div class="footer-bottom"><p>&copy; 2026 Sneakers House.</p></div></div>
</footer>
<script src="/js/script.js"></script>
<script>
async function loadCart() {
  const res = await fetch('/api/cart', { credentials: 'include' });
  const data = await res.json();
  const el = document.getElementById('cartContent');

  if (!data.items?.length) {
    el.innerHTML = `
      <div class="empty-state">
        <h2>Your cart is empty</h2>
        <p>Looks like you haven't added any sneakers yet.</p>
        <a href="/products.html" class="btn btn-primary">Shop Now</a>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="cart-layout">
      <div class="cart-items">
        ${data.items.map(item => `
          <div class="cart-item">
            <a href="/product_detail.html?slug=${item.slug}" class="cart-item-img">
              ${item.image_url ? `<img src="${item.image_url}" alt="${item.name}">` : '👟'}
            </a>
            <div class="cart-item-info">
              <h3><a href="/product_detail.html?slug=${item.slug}">${item.name}</a></h3>
              <p>Size: ${item.size || '—'} · ${formatPrice(item.price)}</p>
              <div class="cart-item-actions">
                <input type="number" min="1" value="${item.quantity}" 
                  onchange="updateQty(${item.productId}, this.value, '${item.size}')" style="width:60px">
                <button class="btn btn-outline btn-sm" onclick="removeItem(${item.productId}, '${item.size}')">Remove</button>
              </div>
            </div>
            <div class="cart-item-subtotal">${formatPrice(item.subtotal)}</div>
          </div>
        `).join('')}
      </div>
      <div class="cart-summary">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><strong>${formatPrice(data.total)}</strong></div>
        <div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
        <div class="summary-row total"><span>Total</span><strong>${formatPrice(data.total)}</strong></div>
        <a href="/checkout.html" class="btn btn-primary btn-lg" style="width:100%;margin-top:1rem">Proceed to Checkout</a>
        <a href="/products.html" class="btn btn-outline" style="width:100%;margin-top:0.5rem">Continue Shopping</a>
      </div>
    </div>
  `;
}

async function updateQty(productId, quantity, size) {
  await fetch('/api/cart/update', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ productId, quantity: Number(quantity), size })
  });
  loadCart();
  updateHeaderAuth();
}

async function removeItem(productId, size) {
  await fetch(`/api/cart/${productId}?size=${encodeURIComponent(size)}`, {
    method: 'DELETE',
    credentials: 'include'
  });
  loadCart();
  updateHeaderAuth();
}

document.addEventListener('DOMContentLoaded', loadCart);
</script>
</body>
</html>
