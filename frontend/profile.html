<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Sneakers House</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">Sneakers<span>House</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/products.html">Shop</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="header-actions" id="headerActions"></div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container" style="max-width:640px">
      <h1 class="section-title">My Profile</h1>
      <form id="profileForm" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name">
          </div>
          <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name">
          </div>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" disabled>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" disabled>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone">
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>

      <h2 class="section-title" style="margin-top:3rem">My Orders</h2>
      <div id="ordersList"><p>Loading orders...</p></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container"><div class="footer-bottom"><p>&copy; 2026 Sneakers House.</p></div></div>
</footer>
<script src="/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const me = await getMe();
  if (!me.authenticated) {
    window.location.href = '/login.html';
    return;
  }

  const res = await fetch('/api/profile', { credentials: 'include' });
  const data = await res.json();
  if (data.success) {
    const p = data.profile;
    document.getElementById('first_name').value = p.first_name || '';
    document.getElementById('last_name').value = p.last_name || '';
    document.getElementById('username').value = p.username || '';
    document.getElementById('email').value = p.email || '';
    document.getElementById('phone').value = p.phone || '';
    document.getElementById('address').value = p.address || '';
    document.getElementById('city').value = p.city || '';
  }

  // Orders
  const oRes = await fetch('/api/orders/my', { credentials: 'include' });
  const oData = await oRes.json();
  const list = document.getElementById('ordersList');
  if (oData.orders?.length) {
    list.innerHTML = oData.orders.map(o => `
      <div class="cart-item" style="margin-bottom:0.75rem">
        <div>
          <strong>Order #${o.id}</strong> — ${o.status} · ${o.payment_status === 'paid' ? 'Paid ✓' : (o.payment_status === 'awaiting_verification' ? 'Verifying payment' : (o.payment_method === 'cod' ? 'COD' : ''))}
          <br><small>${new Date(o.created_at).toLocaleString()}</small>
        </div>
        <div>
          ${formatPrice(o.total_amount)}
          <a href="/order_detail.html?id=${o.id}" class="btn btn-outline btn-sm">View</a>
        </div>
      </div>
    `).join('');
  } else {
    list.innerHTML = '<p class="text-muted">No orders yet.</p>';
  }
});

document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/profile', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({
      first_name: document.getElementById('first_name').value,
      last_name: document.getElementById('last_name').value,
      phone: document.getElementById('phone').value,
      address: document.getElementById('address').value,
      city: document.getElementById('city').value
    })
  });
  const data = await res.json();
  showAlert(data.message, data.success ? 'success' : 'error');
});
</script>
</body>
</html>
