<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Sneakers House</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">Sneakers<span>House</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/products.html" class="active">Shop</a></li>
        <li><a href="/products.html?gender=men">Men</a></li>
        <li><a href="/products.html?gender=women">Women</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="header-actions" id="headerActions"></div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container" id="productDetail">
      <p>Loading product...</p>
    </div>
  </section>
  <section class="section" style="background:var(--bg-warm)">
    <div class="container">
      <h2 class="section-title">You May Also Like</h2>
      <div class="product-grid" id="relatedGrid"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom"><p>&copy; 2026 Sneakers House.</p></div>
  </div>
</footer>

<script src="/js/script.js"></script>
<script>
const slug = new URLSearchParams(window.location.search).get('slug');

async function loadProduct() {
  if (!slug) {
    document.getElementById('productDetail').innerHTML = '<p>Product not found.</p>';
    return;
  }
  const res = await fetch(`/api/products/${slug}`);
  const data = await res.json();
  if (!data.success) {
    document.getElementById('productDetail').innerHTML = `<p>${data.message}</p>`;
    return;
  }
  const p = data.product;
  document.title = `${p.name} | Sneakers House`;
  document.getElementById('productDetail').innerHTML = `
    <div class="product-detail-layout">
      <div class="product-detail-image">
        ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : '<div class="placeholder-img" style="font-size:6rem">👟</div>'}
      </div>
      <div class="product-detail-info">
        <span class="product-brand">${p.brand}</span>
        <h1>${p.name}</h1>
        <p class="product-price" style="font-size:1.5rem;margin:0.5rem 0">${formatPrice(p.price)}</p>
        <p class="text-muted">${p.description}</p>
        <ul class="product-specs">
          <li><strong>Category:</strong> ${p.category_name}</li>
          <li><strong>Gender:</strong> ${p.gender}</li>
          <li><strong>Color:</strong> ${p.color || '—'}</li>
          <li><strong>Stock:</strong> ${p.stock > 0 ? p.stock + ' available' : 'Out of stock'}</li>
        </ul>
        <div class="add-to-cart-form">
          <label for="sizeSelect">Size</label>
          <select id="sizeSelect">
            <option value="40">40</option>
            <option value="41">41</option>
            <option value="42" selected>42</option>
            <option value="43">43</option>
            <option value="44">44</option>
            <option value="45">45</option>
          </select>
          <label for="qtyInput">Qty</label>
          <input type="number" id="qtyInput" value="1" min="1" max="${p.stock}" style="width:70px">
          <button class="btn btn-primary btn-lg" id="addBtn" ${p.stock < 1 ? 'disabled' : ''}>
            ${p.stock < 1 ? 'Sold Out' : 'Add to Cart'}
          </button>
          <button class="btn btn-bkash btn-lg" id="buyNowBtn" ${p.stock < 1 ? 'disabled' : ''}>⚡ Buy Now (bKash)</button>
          <a class="btn btn-wa btn-lg" id="waOrderBtn" href="#" target="_blank" rel="noopener">💬 Order on WhatsApp</a>
        </div>
      </div>
    </div>
  `;

  document.getElementById('addBtn')?.addEventListener('click', async () => {
    const size = document.getElementById('sizeSelect').value;
    const quantity = Number(document.getElementById('qtyInput').value) || 1;
    const res = await fetch('/api/cart/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ productId: p.id, quantity, size })
    });
    const d = await res.json();
    showAlert(d.message, d.success ? 'success' : 'error');
    if (d.success) updateHeaderAuth();
  });

  // Buy Now: add to cart, then go straight to checkout/payment
  document.getElementById('buyNowBtn')?.addEventListener('click', async () => {
    const size = document.getElementById('sizeSelect').value;
    const quantity = Number(document.getElementById('qtyInput').value) || 1;
    const r = await fetch('/api/cart/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ productId: p.id, quantity, size })
    });
    const d = await r.json();
    if (d.success) window.location.href = '/checkout.html';
    else showAlert(d.message, 'error');
  });

  // WhatsApp: opens a chat with the product details pre-filled
  const waBtn = document.getElementById('waOrderBtn');
  const refreshWa = () => {
    const size = document.getElementById('sizeSelect').value;
    const qty = document.getElementById('qtyInput').value || 1;
    waBtn.href = whatsappLink(`Hello Sneakers House, I want to order:\n${p.name}\nSize: ${size}\nQty: ${qty}\nPrice: ${formatPrice(p.price)}`);
  };
  refreshWa();
  document.getElementById('sizeSelect').addEventListener('change', refreshWa);
  document.getElementById('qtyInput').addEventListener('input', refreshWa);

  // Related
  if (data.related?.length) {
    document.getElementById('relatedGrid').innerHTML = data.related.map(r => `
      <article class="product-card">
        <a href="/product_detail.html?slug=${r.slug}" class="product-image">
          ${r.image_url ? `<img src="${r.image_url}" alt="${r.name}" loading="lazy">` : '<div class="placeholder-img">👟</div>'}
        </a>
        <div class="product-info">
          <span class="product-brand">${r.brand}</span>
          <h3><a href="/product_detail.html?slug=${r.slug}">${r.name}</a></h3>
          <span class="product-price">${formatPrice(r.price)}</span>
        </div>
      </article>
    `).join('');
  }
}

document.addEventListener('DOMContentLoaded', loadProduct);
</script>
</body>
</html>
