<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Detail | Sneakers House</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">Sneakers<span>House</span></a>
    <div class="header-actions" id="headerActions"></div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container" style="max-width:700px">
      <h1 class="section-title">Order Details</h1>
      <div id="orderContent"><p>Loading...</p></div>
    </div>
  </section>
</main>
<script src="/js/script.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');
const PAY_LABEL = {
  awaiting_verification: ['Awaiting payment verification', 'warn'],
  paid: ['Paid ✓', 'good'],
  rejected: ['Payment rejected', 'bad'],
  cod_pending: ['Cash on Delivery', 'warn']
};

async function loadOrder() {
  if (!id) { document.getElementById('orderContent').innerHTML = '<p>Order not found.</p>'; return; }
  const res = await fetch(`/api/orders/${id}`, { credentials: 'include' });
  const data = await res.json();
  if (!data.success) {
    document.getElementById('orderContent').innerHTML = `<p>${data.message}</p>`;
    return;
  }
  const o = data.order;
  document.getElementById('orderContent').innerHTML = `
    <div class="cart-summary" style="margin-bottom:1.5rem">
      <div class="summary-row"><span>Order #</span><strong>${o.id}</strong></div>
      <div class="summary-row"><span>Status</span><strong>${o.status}</strong></div>
      <div class="summary-row"><span>Payment</span><span class="status-badge ${(PAY_LABEL[o.payment_status]||['','' ])[1]}">${(PAY_LABEL[o.payment_status]||[o.payment_status||'—'])[0]}</span></div>
      ${o.payment_method === 'bkash' ? `<div class="summary-row"><span>bKash TrxID</span><span>${o.bkash_trx_id}</span></div>` : ''}
      <div class="summary-row"><span>Date</span><span>${new Date(o.created_at).toLocaleString()}</span></div>
      <div class="summary-row"><span>Ship to</span><span>${o.full_name}, ${o.address}, ${o.city} ${o.postal_code}</span></div>
      <div class="summary-row total"><span>Total</span><strong>${formatPrice(o.total_amount)}</strong></div>
    </div>
    <h3>Items</h3>
    ${data.items.map(i => `
      <div class="cart-item">
        <div class="cart-item-img">${i.image_url ? `<img src="${i.image_url}" alt="${i.name}">` : '👟'}</div>
        <div class="cart-item-info">
          <h3>${i.name}</h3>
          <p>Qty: ${i.quantity} · Size: ${i.size || '—'} · ${formatPrice(i.price)}</p>
        </div>
        <div class="cart-item-subtotal">${formatPrice(i.price * i.quantity)}</div>
      </div>
    `).join('')}
    <p style="margin-top:1.5rem"><a href="/profile.html" class="btn btn-outline">Back to Profile</a>
      <a href="${whatsappLink('Hello, I have a question about my order #' + o.id)}" target="_blank" rel="noopener" class="btn btn-wa">💬 Ask about this order</a></p>
  `;
}
document.addEventListener('DOMContentLoaded', () => {
  loadOrder();
  setInterval(loadOrder, 10000); // live status: refreshes every 10 seconds
});
</script>
</body>
</html>
